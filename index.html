<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Chat AI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap');
:root{--bg:#000;--panel:#0b0b0b;--panel2:#111;--text:#f4f4f4;--muted:#8b8b8b;--line:#242424;--hover:#181818;--pill:#171717}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Vazirmatn,Inter,sans-serif}body{overflow:hidden}
button,input,textarea{font:inherit}.hidden{display:none!important}
.app{height:100dvh;display:flex;background:#000}.side{width:270px;flex:none;border-left:1px solid var(--line);background:#050505;padding:14px;display:flex;flex-direction:column;transition:transform .45s cubic-bezier(.22,1,.36,1);z-index:10}
.brand{display:flex;align-items:center;gap:10px;padding:10px 8px 20px;font-weight:700}.brandmark{width:28px;height:28px;border:1px solid #444;border-radius:9px;display:grid;place-items:center;font-size:12px}
.new{border:1px solid #303030;background:#0c0c0c;color:#eee;border-radius:13px;padding:11px 13px;cursor:pointer;text-align:right;transition:.2s}.new:hover{background:#171717;border-color:#444}
.chats{flex:1;overflow:auto;margin-top:14px}.chatitem{padding:10px 11px;border-radius:10px;color:#a4a4a4;font-size:12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chatitem:hover,.chatitem.active{background:#141414;color:#fff}
.account{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;display:flex;align-items:center;gap:9px}.userdot{width:31px;height:31px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-size:11px}.email{font-size:10px;color:#777;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.logout{background:none;border:0;color:#777;cursor:pointer;font-size:11px}
.main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}.top{height:58px;border-bottom:1px solid #171717;display:flex;align-items:center;justify-content:center;position:relative;background:rgba(0,0,0,.72);backdrop-filter:blur(18px);z-index:3}.topname{font-size:14px;font-weight:600}.menu{position:absolute;right:15px;background:none;border:0;color:#aaa;font-size:20px;display:none}
.chat{flex:1;overflow:auto;scroll-behavior:smooth}.messages{width:min(860px,100%);margin:auto;padding:40px 22px 170px}.welcome{min-height:58vh;display:grid;place-items:center;text-align:center}.welcomein{transform:translateY(-18px);animation:appear .8s cubic-bezier(.22,1,.36,1)}.mark{width:54px;height:54px;border:1px solid #444;border-radius:18px;margin:0 auto 24px;display:grid;place-items:center;background:linear-gradient(145deg,#1a1a1a,#050505);box-shadow:0 0 70px #fff0}.welcome h1{font-size:29px;margin:0 0 9px;letter-spacing:-.8px}.welcome p{font-size:12px;color:#777;margin:0}
.msg{display:flex;gap:13px;margin:27px 0;animation:appear .35s cubic-bezier(.22,1,.36,1)}.msg.user{flex-direction:row-reverse}.msg .avatar{width:28px;height:28px;min-width:28px;border-radius:9px;background:#eee;color:#111;display:grid;place-items:center;font-size:9px;margin-top:3px}.msg.ai .avatar{background:#151515;color:#eee;border:1px solid #303030}.bubble{font-size:14px;line-height:2;white-space:pre-wrap;word-break:break-word;max-width:78%}.user .bubble{background:#181818;border:1px solid #262626;border-radius:17px 17px 5px 17px;padding:10px 14px}
.composerwrap{position:absolute;bottom:0;left:0;right:0;padding:22px 20px 17px;background:linear-gradient(transparent,#000 30%)}.composer{width:min(860px,100%);margin:auto;background:#111;border:1px solid #292929;border-radius:22px;padding:8px 9px 8px 13px;display:flex;align-items:flex-end;box-shadow:0 15px 60px #000}
textarea{flex:1;min-height:42px;max-height:170px;background:transparent;border:0;outline:0;color:#eee;resize:none;padding:8px;font-size:13px;line-height:1.8}.send{width:41px;height:41px;border:0;border-radius:14px;background:#eee;color:#000;cursor:pointer;transition:.25s}.send:hover{transform:scale(1.04)}.send:disabled{opacity:.3}.hint{text-align:center;color:#555;font-size:9px;margin-top:8px}
.auth{position:fixed;inset:0;background:#000;z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch}.authwrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:28px 20px calc(18px + env(safe-area-inset-bottom))}.authcard{width:min(390px,100%);text-align:center;margin-block:auto;animation:appear .6s cubic-bezier(.22,1,.36,1) backwards}.sub{font-size:12px;color:#777;margin-bottom:25px}.authinput{width:100%;height:49px;border:1px solid #303030;background:#0b0b0b;color:#fff;border-radius:14px;padding:0 15px;outline:none;text-align:left;direction:ltr;transition:.2s}.authinput:focus{border-color:#666;box-shadow:0 0 0 4px #fff0008}.authbutton{width:100%;height:49px;border:0;background:#eee;color:#000;border-radius:14px;margin-top:10px;cursor:pointer;font-weight:600}.back{background:none;border:0;color:#777;margin-top:13px;cursor:pointer;font-size:11px}.otp{letter-spacing:12px;text-align:center;font-size:20px;direction:ltr}.authmsg{height:20px;color:#888;font-size:10px;margin-top:12px}.autherr{color:#e77}.loader{position:fixed;inset:0;background:#000;z-index:100;display:grid;place-items:center}.spin{width:25px;height:25px;border:2px solid #222;border-top-color:#eee;border-radius:50%;animation:spin .7s linear infinite}

/* ===== Logo ===== */
.logo{display:block;max-width:100%;height:auto;object-fit:contain}
.logo-top{width:150px}.logo-side{width:170px}
.logo-auth{width:clamp(220px,72vw,320px);margin:0 auto 30px;animation:logoIn .6s cubic-bezier(.22,1,.36,1) backwards}
.logo-welcome{width:clamp(180px,56vw,280px);margin:0 auto 28px}
.logo-uni{width:clamp(190px,62vw,260px);margin:0 auto 22px;animation:logoIn .6s .05s cubic-bezier(.22,1,.36,1) backwards}
.brand{padding:10px 8px 20px}
/* ===== Login footer ===== */
.authfoot{margin-top:24px;text-align:center;direction:ltr;animation:fadein .7s .25s ease backwards}
.powered{font-size:11px;font-weight:400;color:#5f5f5f}
.credit{margin-top:6px;font-size:12px;font-weight:500;letter-spacing:.06em;color:#666}
.credit a{display:inline-block;color:#9b9b9b;text-decoration:none;transition:color .25s ease,letter-spacing .25s ease,transform .25s ease}
.credit a:hover,.credit a:focus-visible{color:#cfcfcf;letter-spacing:.1em;transform:translateY(-1px)}
.credit a:focus-visible{outline:1px solid #666;outline-offset:3px;border-radius:3px}
/* ===== University card ===== */
.unicard{margin-top:22px;border:1px solid #262626;background:#0a0a0a;border-radius:16px;padding:15px 16px;cursor:pointer;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .25s ease,border-color .25s ease,background-color .25s ease,box-shadow .25s ease;animation:appear .6s .15s cubic-bezier(.22,1,.36,1) backwards;-webkit-tap-highlight-color:transparent}
.unicard:hover{border-color:#3d3d3d;background:#121212;transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.4)}
.unicard:focus-visible{outline:2px solid #8a8a8a;outline-offset:3px}
.unicard:active{transform:none}
.unititle{font-size:13px;font-weight:600;color:#eee}
.freebadge{display:inline-block;margin-top:8px;font-family:Inter,sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.04em;line-height:1.5;padding:1px 9px;border-radius:999px;border:1px solid rgba(94,190,170,.35);color:#7cc4b4;background:transparent;animation:fadein .6s .3s ease backwards}
.unisub{font-size:11px;color:#777;margin-top:8px}
/* ===== University modal ===== */
.unimodal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
.unimodal.open{display:block;animation:fadein .3s ease}
.unibox{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
.unipanel{position:relative;width:min(400px,100%);text-align:center;background:#080808;border:1px solid #242424;border-radius:20px;padding:34px 22px 26px;animation:appear .45s cubic-bezier(.22,1,.36,1) backwards}
.unipanel h2{font-size:17px;margin:0 0 8px;font-weight:600}
.unipanel .unidesc{font-size:12px;color:#8b8b8b;margin:0 0 24px}
.uniclose{position:absolute;top:12px;left:12px;width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:#888;font-size:22px;line-height:1;cursor:pointer;transition:color .2s ease,transform .2s ease}
.uniclose:hover{color:#fff;transform:translateY(-1px)}
.uniclose:focus-visible{outline:2px solid #8a8a8a;outline-offset:2px}
/* ===== Buttons / OTP step ===== */
.authbutton{transition:transform .2s ease,opacity .2s ease}.authbutton:hover:not(:disabled){transform:translateY(-1px)}.authbutton:active{transform:none}.authbutton:disabled{opacity:.5;cursor:default}
#otpStep{animation:appear .4s cubic-bezier(.22,1,.36,1) backwards}
.authinput::placeholder{color:#555}
@keyframes logoIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:750px){.side{position:fixed;right:0;top:0;bottom:0;transform:translateX(100%);box-shadow:-30px 0 80px #000}.side.open{transform:none}.menu{display:block}.messages{padding:28px 15px 160px}.bubble{max-width:88%}}
</style>
</head>

function add(role,text){const el=document.createElement('div');el.className='msg '+role;el.innerHTML='<div class="avatar">'+(role==='user'?'شما':'✦')+'</div><div class="bubble"></div>';el.querySelector('.bubble').textContent=text;$('messages').appendChild(el);$('chat').scrollTop=$('chat').scrollHeight}
async function loadChats(){const {data}=await sb.from('chats').select('id,title').order('created_at',{ascending:false});$('chats').innerHTML='';(data||[]).forEach(c=>{let x=document.createElement('div');x.className='chatitem';x.textContent=c.title||'گفتگوی جدید';x.onclick=()=>openChat(c.id);$('chats').appendChild(x)})}
async function openChat(id){currentChat=id;welcome();const {data}=await sb.from('messages').select('role,content').eq('chat_id',id).order('created_at');(data||[]).forEach(m=>add(m.role,m.content));$('side').classList.remove('open')}
async function createChat(title){const {data,error}=await sb.from('chats').insert({user_id:user.id,title:title.slice(0,50)}).select().single();if(error)throw error;currentChat=data.id;await loadChats();return data.id}
async function send(){const input=$('input'),text=input.value.trim();if(!text)return;input.value='';resize();$('send').disabled=true;try{if(!currentChat)await createChat(text);await sb.from('messages').insert({chat_id:currentChat,user_id:user.id,role:'user',content:text});add('user',text);let typing=document.createElement('div');typing.className='msg ai';typing.id='typing';typing.innerHTML='<div class="avatar">✦</div><div class="bubble">در حال فکر کردن…</div>';$('messages').appendChild(typing);const {data:history}=await sb.from('messages').select('role,content').eq('chat_id',currentChat).order('created_at');const r=await fetch(APP_CONFIG.AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:history||[],user_id:user.id,chat_id:currentChat})});if(!r.ok)throw Error('AI endpoint error');const d=await r.json();const answer=d.response??d.output??d.text??d.message??JSON.stringify(d);$('typing')?.remove();add('ai',String(answer));await sb.from('messages').insert({chat_id:currentChat,user_id:user.id,role:'ai',content:String(answer)})}catch(e){$('typing')?.remove();add('ai','خطا در دریافت پاسخ. تنظیمات اتصال را بررسی کنید.');console.error(e)}finally{$('send').disabled=false;$('input').focus()}}
function resize(){let x=$('input');x.style.height='auto';x.style.height=Math.min(x.scrollHeight,170)+'px'}
$('sendOtp').onclick=async()=>{const email=$('email').value.trim();if(!email)return msg('ایمیل را وارد کنید.',true);$('sendOtp').disabled=true;msg('در حال ارسال کد…');const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});$('sendOtp').disabled=false;if(error)return msg(error.message,true);emailForOtp=email;$('emailStep').classList.add('hidden');$('otpStep').classList.remove('hidden');$('sub').textContent='کد ۶ رقمی ارسال‌شده به ایمیل را وارد کنید.';msg('کد ارسال شد. پوشه Spam را هم بررسی کنید.')}
$('verifyOtp').onclick=async()=>{const token=$('otp').value.trim();if(!/^\d{6}$/.test(token))return msg('کد باید ۶ رقمی باشد.',true);$('verifyOtp').disabled=true;const {data,error}=await sb.auth.verifyOtp({email:emailForOtp,token,type:'email'});$('verifyOtp').disabled=false;if(error)return msg(error.message,true);user=data.user;await init()}
$('backOtp').onclick=()=>{$('otpStep').classList.add('hidden');$('emailStep').classList.remove('hidden');$('sub').textContent='ایمیل خود را وارد کنید تا کد ورود برایتان ارسال شود.';msg('')}
$('newChat').onclick=async()=>{currentChat=null;welcome();$('side').classList.remove('open')}
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()}
$('menu').onclick=()=>$('side').classList.toggle('open');$('send').onclick=send;$('input').addEventListener('input',resize);$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}})
async function init(){const {data}=await sb.auth.getSession();user=data.session?.user||user;if(!user)return showAuth();showApp();welcome();await loadChats()}
sb.auth.onAuthStateChange((_e,s)=>{if(s){user=s.user;if(document.getElementById('auth')&&!$('auth').classList.contains('hidden'))init()}});init();
</script>

<script>
(function(){
 var g=function(i){return document.getElementById(i)};
 var modal=g('uniModal'),card=g('uniCard'),slot=g('uniSlot'),home=g('loginHome'),wrap=g('loginFormWrap'),closeBtn=g('uniClose'),authEl=g('auth');
 function isOpen(){return modal.classList.contains('open')}
 function openUni(){
  if(isOpen())return;
  slot.appendChild(wrap);
  modal.classList.add('open');
  card.setAttribute('aria-expanded','true');
  var target=g('emailStep').classList.contains('hidden')?g('otp'):g('email');
  setTimeout(function(){try{target.focus({preventScroll:true})}catch(e){}},60);
 }
 function closeUni(restoreFocus){
  if(!isOpen())return;
  home.appendChild(wrap);
  modal.classList.remove('open');
  card.setAttribute('aria-expanded','false');
  if(restoreFocus)card.focus();
 }
 card.addEventListener('click',openUni);
 card.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){e.preventDefault();openUni()}});
 closeBtn.addEventListener('click',function(){closeUni(true)});
 modal.addEventListener('click',function(e){if(e.target===modal||e.target.classList.contains('unibox'))closeUni(true)});
 document.addEventListener('keydown',function(e){if(e.key==='Escape'&&isOpen())closeUni(true)});
 /* بعد از ورود موفق، #auth مخفی می‌شود؛ Modal هم بسته و فرم به جای اصلی برمی‌گردد */
 new MutationObserver(function(){if(authEl.classList.contains('hidden'))closeUni(false)}).observe(authEl,{attributes:true,attributeFilter:['class']});
})();
