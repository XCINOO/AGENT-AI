<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--bg:#000;--panel:#0b0b0b;--text:#f4f4f4;--muted2:#7d7d7d;--line:#242424;--item-text:#a4a4a4;--glow:rgba(255,255,255,.55);--sweep:#fff;--ease-out:cubic-bezier(.22,1,.36,1)}
:root[data-theme="light"]{color-scheme:light;--bg:#fff;--panel:#f7f7f8;--text:#111113;--muted2:#6e6e75;--line:#e3e3e7;--item-text:#55555c;--glow:rgba(0,98,214,.45);--sweep:#0062d6}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Vazirmatn,Inter,sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;align-items:center;justify-content:center;padding:24px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
.wrap{width:100%;max-width:420px;text-align:center}
.logo-wrap{position:relative;width:clamp(220px,72vw,320px);margin:0 auto 38px;direction:ltr;animation:logoReveal 1.3s var(--ease-out) backwards}
.logo-wrap::before{content:"";position:absolute;inset:-60% -12%;z-index:0;pointer-events:none;background:radial-gradient(closest-side,var(--glow),transparent 72%);filter:blur(16px);opacity:.12;animation:glowBreath 4.2s ease-in-out 1.3s infinite}
.logo{position:relative;z-index:1;display:block;width:100%;height:auto;object-fit:contain;opacity:.55}
:root[data-theme="light"] .logo{filter:invert(1)}
.logo-shine{position:absolute;inset:0;z-index:2;pointer-events:none;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;background:linear-gradient(105deg,transparent 40%,var(--sweep) 50%,transparent 60%);background-size:300% 100%;background-position:150% 0;animation:shine 3.4s cubic-bezier(.45,0,.2,1) 1.2s infinite}
.spin{width:38px;height:38px;margin:0 auto 22px;border:3px solid var(--line);border-top-color:var(--text);border-radius:50%;animation:spin 1s linear infinite}
h1{margin:0 0 10px;font-size:20px;font-weight:600;animation:fadein 1s .2s ease backwards}
p{margin:0;font-size:13px;line-height:2;color:var(--muted2);animation:fadein 1s .3s ease backwards}
.foot{margin-top:38px;direction:ltr;animation:fadein 1.1s .4s ease backwards}
.credit{font-size:14px;font-weight:500;letter-spacing:.05em;color:var(--muted2)}
.credit a{display:inline-block;font-size:18px;font-weight:600;letter-spacing:.06em;color:var(--text);text-decoration:none;animation:creditPulse 4.6s ease-in-out infinite;transition:letter-spacing .5s var(--ease-out),transform .5s var(--ease-out)}
.credit a:hover,.credit a:focus-visible{transform:translateY(-1px);animation-play-state:paused}
.credit a:focus-visible{outline:2px solid var(--item-text);outline-offset:3px;border-radius:3px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes logoReveal{from{opacity:0;filter:blur(10px);clip-path:inset(0 100% 0 0);transform:translateY(8px) scale(.97)}60%{filter:blur(2px)}to{opacity:1;filter:blur(0);clip-path:inset(-80% -20% -80% -20%);transform:none}}
@keyframes shine{0%{background-position:150% 0}65%,100%{background-position:-50% 0}}
@keyframes glowBreath{0%,100%{opacity:.1;transform:scale(.96)}50%{opacity:.42;transform:scale(1.04)}}
@keyframes creditPulse{0%,100%{opacity:.78;text-shadow:0 0 0 transparent}50%{opacity:1;text-shadow:0 0 14px var(--glow)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.logo{opacity:1}.logo-shine{display:none}.logo-glow{display:none}}

/* ---- افکت رنگی نرم دنبال‌کننده‌ی ماوس ---- */
:root{--c1:#3b82f6;--c2:#8b5cf6;--c3:#ec4899;--c4:#06b6d4}
.aura{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;animation:auraIn 1.8s ease .2s backwards}
.blob{position:absolute;left:0;top:0;opacity:.28;mix-blend-mode:screen;will-change:transform;transform:translate3d(-999px,-999px,0)}
.blob::after{content:"";position:absolute;inset:0;background:var(--g);filter:blur(48px);border-radius:60% 40% 55% 45%/50% 60% 40% 50%;animation:morph var(--d,14s) ease-in-out infinite alternate}
.b1{width:clamp(180px,32vw,340px);height:clamp(140px,24vw,260px);--g:linear-gradient(120deg,var(--c1),var(--c4));--d:15s}
.b2{width:clamp(160px,28vw,300px);height:clamp(150px,26vw,290px);--g:linear-gradient(200deg,var(--c2),var(--c1));--d:18s}
.b3{width:clamp(140px,24vw,260px);height:clamp(110px,18vw,200px);--g:linear-gradient(60deg,var(--c3),var(--c2));--d:13s}
.b4{width:clamp(120px,20vw,210px);height:clamp(120px,20vw,210px);--g:linear-gradient(160deg,var(--c4),var(--c3));--d:17s}
:root[data-theme="light"] .blob{mix-blend-mode:normal;opacity:.18}
@keyframes morph{
  0%{border-radius:60% 40% 55% 45%/50% 60% 40% 50%;transform:rotate(0) scale(1,1)}
  50%{border-radius:38% 62% 46% 54%/62% 38% 62% 38%;transform:rotate(28deg) scale(1.18,.82)}
  100%{border-radius:55% 45% 62% 38%/42% 58% 42% 58%;transform:rotate(-18deg) scale(.88,1.14)}
}
/* متن: رنگ نرم فقط جایی که ماوس نزدیک است */
.lit{color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:radial-gradient(circle 100px at var(--mx,-999px) var(--my,-999px),#67e8f9 0%,#a78bfa 38%,#f472b6 66%,transparent 100%),linear-gradient(var(--lit-base),var(--lit-base))}
h1.lit{--lit-base:var(--text)}
p.lit{--lit-base:var(--muted2)}
.wrap{position:relative;z-index:1}
.logo-glow{position:absolute;inset:0;z-index:3;pointer-events:none;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;background:radial-gradient(circle 95px at var(--lx,-999px) var(--ly,-999px),#67e8f9 0%,#a78bfa 38%,#f472b6 66%,transparent 100%)}
@keyframes auraIn{from{opacity:0}to{opacity:1}}

/* ---- بازی مار ---- */
body{height:auto;min-height:100%}
.play{margin-top:24px;font:inherit;font-size:13px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 22px;cursor:pointer;transition:border-color .25s ease,transform .25s ease;animation:fadein 1s .5s ease backwards}
.play:hover{border-color:var(--item-text);transform:translateY(-1px)}
.play:focus-visible{outline:2px solid var(--item-text);outline-offset:3px}
.game{margin:20px auto 0;width:288px;max-width:100%;animation:fadein .5s ease}
.game[hidden]{display:none}
.game canvas{display:block;width:100%;aspect-ratio:1;border:1px solid var(--line);border-radius:18px;background:var(--panel);touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.score{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--muted2)}

/* ---- بهینه‌سازی iOS و Android ---- */
html{height:-webkit-fill-available;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;min-height:100dvh;min-height:-webkit-fill-available;
  padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right));
  overscroll-behavior-y:none;touch-action:manipulation;-webkit-font-smoothing:antialiased}
.play{-webkit-appearance:none;appearance:none;min-height:46px;-webkit-user-select:none;user-select:none}
.game,.game canvas{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.game{width:min(100%,320px)}
@media (pointer:coarse){
  .blob::after{filter:blur(36px)}
  .b4{display:none}
  .credit a{padding:8px 4px}
}
@media (max-height:520px){.logo-wrap{margin-bottom:22px}.foot{margin-top:22px}}
</style>

  if(reduce){ place(0); return; }
  function move(e){
    var p=e.touches&&e.touches[0]?e.touches[0]:e;
    target.x=p.clientX;target.y=p.clientY;active=true;
  }
  addEventListener("pointermove",move,{passive:true});
  addEventListener("pointerdown",move,{passive:true});
  document.addEventListener("pointerleave",function(){active=false});
  addEventListener("resize",function(){W=innerWidth;H=innerHeight});
  function frame(t){
    if(!active){
      target.x=W/2+Math.cos(t/2800)*W*.26;
      target.y=H/2+Math.sin(t/3600)*H*.2;
    }
    for(var i=0;i<pos.length;i++){
      pos[i].x+=(target.x-pos[i].x)*lag[i];
      pos[i].y+=(target.y-pos[i].y)*lag[i];
    }
    place(t);
    for(var k=0;k<lits.length;k++){
      var lr=lits[k].getBoundingClientRect();
      lits[k].style.setProperty("--mx",(pos[0].x-lr.left)+"px");
      lits[k].style.setProperty("--my",(pos[0].y-lr.top)+"px");
    }
    if(wrap){
      var r=wrap.getBoundingClientRect();
      wrap.style.setProperty("--lx",(pos[0].x-r.left)+"px");
      wrap.style.setProperty("--ly",(pos[0].y-r.top)+"px");
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<script>
(function(){
  var btn=document.getElementById("playBtn"),box=document.getElementById("game"),cv=document.getElementById("cv"),
      sc=document.getElementById("sc"),bs=document.getElementById("bs"),ctx=cv.getContext("2d");
  var N=16,S=20,SZ=N*S,dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=SZ*dpr;cv.height=SZ*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  var snake,dir,queue,food,score=0,best=0,state="idle",timer=null;
  try{best=+localStorage.getItem("snake_best")||0}catch(e){}
  function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
  function ui(){sc.textContent="امتیاز: "+score;bs.textContent="رکورد: "+best}
  function place(){
    do{food={x:Math.random()*N|0,y:Math.random()*N|0}}
    while(snake.some(function(p){return p.x===food.x&&p.y===food.y}));
  }
  function reset(){snake=[{x:8,y:8},{x:7,y:8},{x:6,y:8}];dir={x:1,y:0};queue=[];score=0;place();ui()}
  function setDir(x,y){
    var last=queue.length?queue[queue.length-1]:dir;
    if((last.x===-x&&last.y===-y)||(last.x===x&&last.y===y))return;
    if(queue.length<3)queue.push({x:x,y:y});
  }
  function start(){if(state==="run")return;reset();state="run";loop()}
  function loop(){
    clearTimeout(timer);
    timer=setTimeout(function(){tick();if(state==="run")loop()},Math.max(70,140-score*4));
  }
  function tick(){
    if(queue.length)dir=queue.shift();
    var h={x:(snake[0].x+dir.x+N)%N,y:(snake[0].y+dir.y+N)%N};
    var eat=h.x===food.x&&h.y===food.y;
    var body=eat?snake:snake.slice(0,-1);
    if(body.some(function(p){return p.x===h.x&&p.y===h.y})){
      state="over";
      if(score>best){best=score;try{localStorage.setItem("snake_best",best)}catch(e){}}
      buzz([40,60,40]);ui();draw();return;
    }
    snake.unshift(h);
    if(eat){score++;place();buzz(12);ui()}else snake.pop();
    draw();
  }
  function rr(x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  }
  function draw(){
    var cs=getComputedStyle(document.documentElement);
    var txt=cs.getPropertyValue("--text").trim()||"#fff",line=cs.getPropertyValue("--line").trim()||"#333",bg=cs.getPropertyValue("--bg").trim()||"#000";
    ctx.clearRect(0,0,SZ,SZ);
    ctx.fillStyle=line;
    for(var x=0;x<N;x++)for(var y=0;y<N;y++)ctx.fillRect(x*S+S/2-1,y*S+S/2-1,2,2);
    ctx.save();ctx.shadowColor="#f472b6";ctx.shadowBlur=14;ctx.fillStyle="#f472b6";
    ctx.beginPath();ctx.arc(food.x*S+S/2,food.y*S+S/2,S*.3,0,7);ctx.fill();ctx.restore();
    for(var i=snake.length-1;i>=0;i--){
      var t=i/Math.max(1,snake.length-1);
      ctx.fillStyle="hsl("+(210+t*110)+",85%,"+(i===0?"68%":"60%")+")";
      rr(snake[i].x*S+1.5,snake[i].y*S+1.5,S-3,S-3,5);ctx.fill();
    }
    if(state!=="run"){
      ctx.save();ctx.globalAlpha=.72;ctx.fillStyle=bg;ctx.fillRect(0,0,SZ,SZ);ctx.restore();
      ctx.fillStyle=txt;ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.font="600 16px Vazirmatn,Inter,sans-serif";
      ctx.fillText(state==="over"?"باختی! امتیاز: "+score:"آماده‌ای؟",SZ/2,SZ/2-12);
      ctx.font="400 12px Vazirmatn,Inter,sans-serif";
      ctx.fillText(state==="over"?"برای بازی دوباره بزن":"برای شروع بزن یا یک جهت بکش",SZ/2,SZ/2+14);
    }
  }
  function open(){box.hidden=false;state="idle";reset();draw();btn.textContent="بستن بازی";btn.setAttribute("aria-expanded","true");setTimeout(function(){try{box.scrollIntoView({behavior:"smooth",block:"center"})}catch(e){box.scrollIntoView()}},60)}
  function close(){clearTimeout(timer);state="idle";box.hidden=true;btn.textContent="🎮 تا آماده شدن سایت، بازی کن";btn.setAttribute("aria-expanded","false")}
  btn.addEventListener("click",function(){box.hidden?open():close()});
  cv.addEventListener("click",function(){if(state!=="run")start()});
  var keys={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
  document.addEventListener("keydown",function(e){
    if(box.hidden)return;
    var k=keys[e.key];
    if(k){e.preventDefault();if(state!=="run")start();setDir(k[0],k[1])}
    else if(e.key===" "||e.key==="Enter"){if(e.target===btn)return;e.preventDefault();if(state!=="run")start()}
  });
  var tx=0,ty=0,tracking=false;
  cv.addEventListener("touchstart",function(e){var t=e.touches[0];tx=t.clientX;ty=t.clientY;tracking=true},{passive:true});
  cv.addEventListener("touchmove",function(e){
    if(!tracking)return;
    var t=e.touches[0],dx=t.clientX-tx,dy=t.clientY-ty;
    if(Math.abs(dx)<16&&Math.abs(dy)<16)return;
    if(state!=="run")start();
    if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);
    tx=t.clientX;ty=t.clientY;
  },{passive:true});
  cv.addEventListener("touchend",function(){tracking=false},{passive:true});
  cv.addEventListener("touchcancel",function(){tracking=false},{passive:true});
  document.addEventListener("visibilitychange",function(){
    if(document.hidden&&state==="run"){clearTimeout(timer);state="idle";draw()}
  });
})();
</script>
</body>
</html>
